spring:
  application:
    name: product-service

  # Production profile: PostgreSQL database
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/fusion_api}
    username: ${DATABASE_USER:postgres}
    password: ${DATABASE_PASSWORD:postgres}
    driverClassName: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      auto-commit: true

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: validate  # Never use create/update in production!
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        generate_statistics: false
        jdbc:
          batch_size: 20
          fetch_size: 100
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: false
    out-of-order: false

  security:
    user:
      enabled: false

  output:
    ansi:
      enabled: NEVER

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  compression:
    enabled: true
    min-response-size: 1024
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health,readiness,liveness,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true
  server:
    port: 9090
  metrics:
    export:
      cloudwatch:
        enabled: true
        namespace: FusionAPI
        batch-size: 20

logging:
  level:
    root: WARN
    com.rest.api: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
    org.springframework.security: INFO
  format: json
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: /var/log/product-service/application.log
    max-size: 100MB
    max-history: 30
    total-size-cap: 10GB
