version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: product-service-postgres-dev
    environment:
      POSTGRES_DB: product_service
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_HOST_AUTHENTICATION_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - product-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: product-service-app-dev
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DATABASE_URL: jdbc:postgresql://postgres:5432/product_service
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      SERVER_PORT: 8080
      # Logging
      LOGGING_LEVEL_ROOT: INFO
      LOGGING_LEVEL_COM_REST_API: DEBUG
    ports:
      - "8080:8080"
      - "9090:9090"  # Management endpoints
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - product-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  product-network:
    driver: bridge

