# Default Helm Chart Values

replicaCount: 2

image:
  repository: 397979615352.dkr.ecr.eu-north-1.amazonaws.com/product-service/kotlin-rest-api
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations:
  prometheus.io/scrape: "true"
  prometheus.io/port: "8080"
  prometheus.io/path: "/actuator/prometheus"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 3000
  fsGroup: 2000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false   # Spring Boot needs tmp writes
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 80
  targetPort: 8080
  name: product-service
  annotations: {}

ingress:
  enabled: false   # Enable once ALB controller is installed
  className: alb
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
  hosts:
    - host: api.productservice.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

nodeSelector: {}

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - product-service
          topologyKey: kubernetes.io/hostname

tolerations: []

livenessProbe:
  httpGet:
    path: /actuator/health/liveness
    port: 8080
  initialDelaySeconds: 60
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /actuator/health/readiness
    port: 8080
  initialDelaySeconds: 30
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 3

config:
  serverPort: 8080
  managementPort: 8080
  logLevel: INFO
  apiLogLevel: DEBUG

database:
  host: "localhost"          # Overridden at deploy time via --set database.host
  port: 5432
  name: fusion_api
  secretName: product-db-credentials
  secretUserKey: username
  secretPasswordKey: password

env:
  SPRING_PROFILES_ACTIVE: prod
  JAVA_OPTS: "-XX:+UseG1GC -XX:MaxGCPauseMillis=200 -Xms256m -Xmx768m"

configMap:
  application.yml: |
    spring:
      application:
        name: product-service
      jpa:
        show-sql: false
        hibernate:
          ddl-auto: validate

persistence:
  enabled: false
  storageClass: gp3
  accessMode: ReadWriteOnce
  size: 10Gi
  mountPath: /var/log/product-service

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 0

podDisruptionBudget:
  enabled: true
  minAvailable: 1

networkPolicy:
  enabled: false   # Enable once network policies are validated

serviceMonitor:
  enabled: false
  interval: 30s
  scrapeTimeout: 10s

rbac:
  create: true
  rules: []

# Set by CI pipeline to force a rolling restart on every deploy
deployment:
  timestamp: "0"

