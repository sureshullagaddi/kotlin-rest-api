# Development Environment Overrides

replicaCount: 1

image:
  pullPolicy: Always

autoscaling:
  enabled: false

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 250m
    memory: 512Mi

config:
  logLevel: DEBUG
  apiLogLevel: DEBUG

database:
  name: fusion_api

env:
  SPRING_PROFILES_ACTIVE: dev
  JAVA_OPTS: "-XX:+UseG1GC -Xms128m -Xmx384m"

ingress:
  enabled: false

livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 15
  failureThreshold: 5

readinessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  failureThreshold: 5

podDisruptionBudget:
  enabled: false

nodeSelector: {}

affinity: {}
