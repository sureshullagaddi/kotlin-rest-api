name: Auto approve

on:
  workflow_run:
    workflows: ["Build"]
    types:
      - completed

jobs:
  auto-approve:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: hmarr/auto-approve-action@v4
        with:
          review-message: "Auto approved automated PR"