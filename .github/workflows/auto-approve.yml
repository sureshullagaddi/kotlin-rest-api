name: Auto approve

on:
  workflow_run:
    workflows: ["Build"] # Must match the 'name' field in build.yml EXACTLY
    types:
      - completed

jobs:
  auto-approve:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: hmarr/auto-approve-action@v4
        with:
          review-message: "Auto approved automated PR"
