name: Kotlin PR Checks

on:
  pull_request_target:
    branches: [ main ]

permissions:
  pull-requests: write
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17
      - run: chmod +x ./gradlew
      - run: ./gradlew build
      - run: ./gradlew test

  auto-approve-and-merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      # Use a dedicated bot's PAT instead of GITHUB_TOKEN to allow approval
      - uses: hmarr/auto-approve-action@v4
        with:
          github-token: "${{ secrets.BOT_PAT }}"
      - uses: peter-evans/enable-pull-request-automerge@v3
        with:
          token: "${{ secrets.GITHUB_TOKEN }}"
          merge-method: squash
          
